[project]
name = "seismic-activity-observatory"
version = "0.1.0"
description = "Observatorio de actividad sísmica: productor, consumidor y API sobre Kafka y PostgreSQL."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka==0.15.0",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "shapely==2.2.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.uv]
# No se construye un paquete: los servicios importan common/, producer/, consumer/ y api/ desde la raíz.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: pruebas contra PostgreSQL 16 real, dentro de la red de Compose",
]
