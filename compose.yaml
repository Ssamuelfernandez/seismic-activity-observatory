# Observatorio sísmico — cinco servicios en Docker Compose (A1, A2).
# Arranque: copiar .env.example a .env y ejecutar `docker compose up --build -d`.
# Entre contenedores se usan nombres de servicio (kafka, postgres), nunca localhost.
# Solo la API se publica en el equipo anfitrión, y solo en 127.0.0.1:8000 (A8).
name: seismic-observatory

# Ajustes comunes de los tres servicios Python: una única imagen con comandos distintos (A3).
# La imagen se construye una sola vez (en `producer`) y consumer y api la reutilizan por nombre;
# construirla tres veces con la misma etiqueta provoca un conflicto en el build.
x-python-service: &python-service
  image: seismic-observatory-python:0.1.0
  pull_policy: never
  restart: unless-stopped
  networks: [backend]

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:?Falta LOG_LEVEL en .env}
  RETRY_INITIAL_SECONDS: ${RETRY_INITIAL_SECONDS:?Falta RETRY_INITIAL_SECONDS en .env}
  RETRY_MAX_SECONDS: ${RETRY_MAX_SECONDS:?Falta RETRY_MAX_SECONDS en .env}

services:
  kafka:
    # Broker Kafka en modo KRaft (sin ZooKeeper), un solo nodo. Sin puertos publicados (A8).
    image: apache/kafka:4.1.2
    restart: unless-stopped
    networks: [backend]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Listener interno anunciado por nombre de servicio; no hay listener para el equipo anfitrión.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los temas los crean productor y consumidor (common/kafka_topics.py); evita temas con nombres erróneos.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Retención limitada de 7 días (A6); cada tema del contrato la fija además con retention.ms.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?Falta DB_API_PASSWORD en .env}
      DB_PRODUCER_PASSWORD: ${DB_PRODUCER_PASSWORD:?Falta DB_PRODUCER_PASSWORD en .env}
      DB_CONSUMER_PASSWORD: ${DB_CONSUMER_PASSWORD:?Falta DB_CONSUMER_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./scripts/postgres_init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      # Por TCP (-h 127.0.0.1): el servidor temporal de la inicialización solo escucha por socket,
      # así que no se declara sano hasta que termina de aplicar el esquema y los roles.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  producer:
    <<: *python-service
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["python", "-m", "producer.main"]
    environment:
      <<: *common-env
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Falta KAFKA_BOOTSTRAP_SERVERS en .env}
      KAFKA_TOPIC: ${KAFKA_TOPIC:?Falta KAFKA_TOPIC en .env}
      POLL_SECONDS: ${POLL_SECONDS:?Falta POLL_SECONDS en .env}
      USGS_FEED_URL: ${USGS_FEED_URL:?Falta USGS_FEED_URL en .env}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:?Falta HTTP_TIMEOUT_SECONDS en .env}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:?Falta RAW_RETENTION_DAYS en .env}
      DB_HOST: ${DB_HOST:?Falta DB_HOST en .env}
      DB_PORT: ${DB_PORT:?Falta DB_PORT en .env}
      DB_NAME: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      DB_USER: observatory_producer
      DB_PASSWORD: ${DB_PRODUCER_PASSWORD:?Falta DB_PRODUCER_PASSWORD en .env}
      HEALTH_FILE: /tmp/producer.alive
      HEALTH_MAX_AGE_SECONDS: 120
    volumes:
      # Archivos del histórico 2025 que lee `python -m producer.replay` (solo lectura).
      - ./data/historical:/app/data/historical:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Sano = el bucle publicó un evento hace menos de HEALTH_MAX_AGE_SECONDS.
      test: ["CMD", "python", "-m", "common.health", "file"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  consumer:
    <<: *python-service
    command: ["python", "-m", "consumer.main"]
    environment:
      <<: *common-env
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Falta KAFKA_BOOTSTRAP_SERVERS en .env}
      KAFKA_TOPIC: ${KAFKA_TOPIC:?Falta KAFKA_TOPIC en .env}
      # Topics a los que se suscribe (live y replay); el defecto evita editar .env en clones antiguos.
      KAFKA_CONSUMER_TOPICS: ${KAFKA_CONSUMER_TOPICS:-earthquakes.live,earthquakes.replay}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:?Falta KAFKA_GROUP_ID en .env}
      DB_HOST: ${DB_HOST:?Falta DB_HOST en .env}
      DB_PORT: ${DB_PORT:?Falta DB_PORT en .env}
      DB_NAME: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      DB_USER: observatory_consumer
      DB_PASSWORD: ${DB_CONSUMER_PASSWORD:?Falta DB_CONSUMER_PASSWORD en .env}
      HEALTH_FILE: /tmp/consumer.alive
      HEALTH_MAX_AGE_SECONDS: 60
      # Catálogo de países (solo lectura) y gancho de fallo de la prueba 8 (vacío = desactivado).
      COUNTRY_CATALOG_PATH: /app/data/catalogo/paises.geojson
      CONSUMER_FAULT_CRASH_AT_OFFSET: ${CONSUMER_FAULT_CRASH_AT_OFFSET:-}
    volumes:
      - ./data/catalogo:/app/data/catalogo:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Sano = el bucle de consumo dio una vuelta hace menos de HEALTH_MAX_AGE_SECONDS.
      test: ["CMD", "python", "-m", "common.health", "file"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  api:
    <<: *python-service
    # Uvicorn escucha en 0.0.0.0 dentro del contenedor (A9); el puerto se publica solo en 127.0.0.1.
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *common-env
      DB_HOST: ${DB_HOST:?Falta DB_HOST en .env}
      DB_PORT: ${DB_PORT:?Falta DB_PORT en .env}
      DB_NAME: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      DB_USER: observatory_api
      DB_PASSWORD: ${DB_API_PASSWORD:?Falta DB_API_PASSWORD en .env}
      # Límites de la API de consulta (common/api_config.py); los valores por defecto coinciden con los del código.
      API_MAX_EVENTS: ${API_MAX_EVENTS:-5000}
      API_DB_TIMEOUT_SECONDS: ${API_DB_TIMEOUT_SECONDS:-5}
      # Orígenes CORS permitidos (F9); el defecto coincide con el del código.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://observatorio.ssamuelfernandez.net,http://localhost:4200}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Sano = GET /api/salud responde 200, es decir, la API alcanza la base con el rol de solo lectura.
      # 127.0.0.1 aquí es el propio contenedor de la API, no otro servicio.
      test: ["CMD", "python", "-m", "common.health", "http", "http://127.0.0.1:8000/api/salud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tests:
    # Pruebas de integración: perfil `test`, no arranca con `docker compose up`.
    # No hereda x-python-service: otra imagen (etapa `test`), sin reinicio automático.
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: seismic-observatory-python-tests:0.1.0
    pull_policy: never
    networks: [backend]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Falta KAFKA_BOOTSTRAP_SERVERS en .env}
      DB_HOST: ${DB_HOST:?Falta DB_HOST en .env}
      DB_PORT: ${DB_PORT:?Falta DB_PORT en .env}
      DB_NAME: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      # Administrador: crea la base temporal y lee la cuarentena; consumidor: el rol real que se prueba.
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      DB_USER: observatory_consumer
      DB_PASSWORD: ${DB_CONSUMER_PASSWORD:?Falta DB_CONSUMER_PASSWORD en .env}
      # Rol real del productor (productor-live): se prueba su almacén de ingesta.
      DB_PRODUCER_PASSWORD: ${DB_PRODUCER_PASSWORD:?Falta DB_PRODUCER_PASSWORD en .env}
      # Rol real de la API (feature api): se prueba con el pool de solo lectura.
      DB_API_PASSWORD: ${DB_API_PASSWORD:?Falta DB_API_PASSWORD en .env}
      EVIDENCE_DIR: /app/evidence
      PYTEST_ADDOPTS: -p no:cacheprovider
    volumes:
      - ./tests:/app/tests:ro
      - ./sql:/app/sql:ro
      # Solo para que tests/scripts/ pueda importar `scripts` dentro del contenedor.
      - ./scripts:/app/scripts:ro
      - ./data/catalogo:/app/data/catalogo:ro
      # Archivos reales del histórico, para las pruebas de integración del replay.
      - ./data/historical:/app/data/historical:ro
      # Lectura y escritura: solo para tests/support/evidence.py.
      - ./docs/evidencias/consumidor-idempotente:/app/evidence
      # Lectura y escritura: resultados de las mediciones (scripts/benchmarks/run_benchmarks.py).
      - ./docs/evidencias/mediciones:/app/evidence-mediciones
    depends_on:
      postgres:
        condition: service_healthy

networks:
  backend:
    name: seismic-observatory-backend

# Volúmenes con nombre: sobreviven a `docker compose down`; solo `down -v` los borra (A5).
volumes:
  postgres-data:
  kafka-data:
